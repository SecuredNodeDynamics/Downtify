name: Desktop packages

on:
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  linux-deb:
    name: Linux .deb
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install Python deps
        run: python -m pip install --upgrade pip pyinstaller && python -m pip install .

      - name: Build frontend
        run: npm ci --prefix frontend && npm run build --prefix frontend

      - name: Build .deb
        run: python scripts/build_desktop.py linux

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: downtify-linux-deb
          path: dist/desktop/linux/*.deb

      - name: Attach to GitHub release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "${{ github.event.release.tag_name }}" dist/desktop/linux/*.deb --clobber

  windows-installer:
    name: Windows Inno Setup installer
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install Inno Setup
        run: choco install innosetup -y

      - name: Install Python deps
        run: python -m pip install --upgrade pip pyinstaller && python -m pip install .

      - name: Build frontend
        run: npm ci --prefix frontend && npm run build --prefix frontend

      - name: Build installer
        run: python scripts/build_desktop.py windows

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: downtify-windows-installer
          path: dist/desktop/windows/DowntifySetup-*.exe

      - name: Attach to GitHub release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "${{ github.event.release.tag_name }}" dist/desktop/windows/DowntifySetup-*.exe --clobber
